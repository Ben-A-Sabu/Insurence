server:
  port: 8080
  servlet:
    context-path: /vehicle-service

spring:
  application:
    name: vehicle-service

  datasource:
    url: jdbc:mysql://localhost:3306/vehicle_db
    username: root
    password: Root1234$
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # use validate in prod
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

